<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter your code</title>
    <!--STYLES-->
  </head>
  <body>
    <!--BANNER-->

    <div class="narrow">
      <div class="card">
        <h1>Enter your code</h1>
        <p class="muted">Step 2 of 3 — <!--SENTTO--></p>

        <!--ERROR-->
        <!--MESSAGE-->

        <form action="/verify" method="POST">
          <label for="code">6-digit code</label>
          <input
            type="text"
            id="code"
            name="code"
            class="otp"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            autofocus
          />
          <button class="full" type="submit">Verify</button>
        </form>
      </div>

      <p class="foot">
        Didn't get it?
        <form action="/verify/resend" method="POST" style="display:inline">
          <button class="link-btn" type="submit">Send a new code</button>
        </form>
        · <a href="/signup">Start over</a>
      </p>
    </div>
  </body>
</html>
