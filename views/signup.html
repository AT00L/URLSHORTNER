<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--STYLES-->
  </head>
  <body>
    <!--BANNER-->

    <div class="narrow">
      <div class="card">
        <h1>Create account</h1>
        <p class="muted">Step 1 of 3 — we'll email you a code to confirm your address.</p>

        <!--ERROR-->
        <!--MESSAGE-->

        <form action="/signup" method="POST">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" />

          <button class="full" type="submit">Send OTP</button>
        </form>
      </div>

      <p class="foot">Already have an account? <a href="/login">Login</a></p>
    </div>
    <!--FOOTER-->
  </body>
</html>
